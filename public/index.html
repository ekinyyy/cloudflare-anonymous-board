<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>匿名留言板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>匿名留言板</h1>
      <p>留下你的想法，大家都看得到。</p>
    </header>
    <section class="card">
      <form id="postForm">
        <label class="field">
          <span>昵称</span>
          <input name="name" type="text" maxlength="50" placeholder="匿名用户">
        </label>
        <label class="field">
          <span>留言内容</span>
          <textarea name="message" maxlength="2000" placeholder="写下你的留言..." required></textarea>
        </label>
        <button type="submit">发表留言</button>
      </form>
    </section>
    <section class="card">
      <div class="section-head">
        <h2>留言列表</h2>
        <span>最新留言</span>
      </div>
      <div id="messages" class="messages"></div>
    </section>
  </main>
  <script>
    async function loadMessages() {
      const res = await fetch('/api/messages', { cache: 'no-store' });
      const data = await res.json();
      const messages = Array.isArray(data.messages) ? data.messages : [];
      const html = messages.length ? messages.map(m => `
            <article class="message-card">
              <div class="message-meta">
                <strong>${escapeHtml(m.name || '匿名用户')}</strong>
                <span class="ip-location">IP属地：${escapeHtml(m.location || '未知')}</span>
                <time>${formatDate(m.createdAt)}</time>
              </div>
              <p>${escapeHtml(m.message || '').replace(/\n/g, '<br>')}</p>
            </article>
          `).join('') : '<div class="empty-state">暂无留言，来做第一个发言的人吧。</div>';
      document.getElementById('messages').innerHTML = html;
    }
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/messages', { method: 'POST', body: new FormData(form) });
      if (res.ok) { form.reset(); await loadMessages(); }
    });
    function escapeHtml(s) { return String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function formatDate(value) { if (!value) return ''; const date = new Date(value); return isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN'); }
    loadMessages();
  </script>
</body>
</html>
