<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>匿名留言板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>匿名留言板</h1>
      <p>留下你的想法，大家都看得到。</p>
    </header>
    <section class="card">
      <form id="postForm">
        <label class="field">
          <span>昵称</span>
          <input name="name" type="text" maxlength="50" placeholder="匿名用户">
        </label>
        <label class="field">
          <span>留言内容</span>
          <textarea name="message" maxlength="2000" placeholder="写下你的留言..." required></textarea>
        </label>
        <button type="submit">发表留言</button>
      </form>
    </section>
    <section class="card">
      <div class="section-head">
        <h2>留言列表</h2>
        <span>最新留言</span>
      </div>
      <div id="messages" class="messages"></div>
    </section>
  </main>
  <script>
    const PENDING_STORAGE_KEY = 'pending_messages';
    let serverMessagesState = [];
    let pendingMessagesState = readPendingMessages();

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      return isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN');
    }

    function safeReadPendingMessages() {
      try {
        const raw = localStorage.getItem(PENDING_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    function readPendingMessages() {
      return safeReadPendingMessages();
    }

    function writePendingMessages(messages) {
      pendingMessagesState = Array.isArray(messages) ? messages.filter(Boolean) : [];
      try {
        localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(pendingMessagesState));
      } catch {
        // ignore storage failures
      }
    }

    function dedupeById(messages) {
      const seen = new Set();
      const result = [];
      for (const message of messages) {
        if (!message) continue;
        const key = message.id || `${message.createdAt || ''}-${message.name || ''}-${message.message || ''}`;
        if (seen.has(key)) continue;
        seen.add(key);
        result.push(message);
      }
      return result;
    }

    function renderMessages(messages) {
      document.getElementById('messages').innerHTML = messages.length
        ? messages.map(m => `
            <article class="message-card">
              <div class="message-meta">
                <strong>${escapeHtml(m.name || '匿名用户')}</strong>
                <time>${formatDate(m.createdAt)}</time>
              </div>
              <p>${escapeHtml(m.message || '').replace(/\n/g, '<br>')}</p>
            </article>`).join('')
        : '<div class="empty-state">暂无留言，来做第一个发言的人吧。</div>';
    }

    function renderCurrentMessages() {
      const combined = dedupeById([...pendingMessagesState, ...serverMessagesState]);
      renderMessages(combined);
    }

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        const apiMessages = Array.isArray(data.messages) ? data.messages : [];
        apiMessages.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

        const apiIds = new Set(apiMessages.map(message => message && message.id).filter(Boolean));
        const filteredPending = pendingMessagesState.filter(message => !message || !message.id || !apiIds.has(message.id));
        if (filteredPending.length !== pendingMessagesState.length) {
          writePendingMessages(filteredPending);
        }

        serverMessagesState = apiMessages;
        pendingMessagesState = filteredPending;
        renderCurrentMessages();
      } catch (error) {
        console.error(error);
      }
    }

    function queuePendingMessage(message) {
      const next = [message, ...pendingMessagesState.filter(item => item && item.id !== message.id)];
      writePendingMessages(next);
      renderCurrentMessages();
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const nameInput = form.elements.name;
      const messageInput = form.elements.message;
      const name = String(nameInput.value || '匿名用户').trim() || '匿名用户';
      const message = String(messageInput.value || '').trim();
      if (!message) return;

      const pendingMessage = {
        id: `pending-${Date.now()}-${crypto.randomUUID()}`,
        name,
        message,
        createdAt: new Date().toISOString(),
        pending: true,
      };

      queuePendingMessage(pendingMessage);
      nameInput.value = '';
      messageInput.value = '';

      const formData = new FormData();
      formData.append('name', name);
      formData.append('message', message);

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          body: formData,
          cache: 'no-store',
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(result.error || '发表失败，请稍后重试');
        }

        const savedMessage = result && typeof result.message === 'object' ? result.message : null;
        if (savedMessage && savedMessage.id) {
          pendingMessagesState = pendingMessagesState.map(item =>
            item && item.id === pendingMessage.id
              ? { ...savedMessage, pending: true }
              : item
          );
          writePendingMessages(pendingMessagesState);
          serverMessagesState = dedupeById([savedMessage, ...serverMessagesState]);
          renderCurrentMessages();
        }

        setTimeout(() => {
          loadMessages();
        }, 5000);
      } catch (error) {
        console.error(error);
        alert(error instanceof Error ? error.message : '发表失败，请稍后重试');
        pendingMessagesState = pendingMessagesState.filter(item => item && item.id !== pendingMessage.id);
        writePendingMessages(pendingMessagesState);
        renderCurrentMessages();
        nameInput.value = name;
        messageInput.value = message;
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadMessages();
    });
  </script>
</body>
</html>
